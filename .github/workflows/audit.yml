name: audit

# `pnpm audit` of dev and main every day, so an advisory published against a dependency shows before
# the next release, not at its first step. A run of its own rather than a step of ci.yml: an advisory
# lands with no change of ours, and as a check it would turn every open pull request red until a
# bump lands. GitHub runs a schedule only from the default branch's copy of this file, so it starts
# once a release brings it to main, and tells whoever last changed the cron line of a failed run.
# A pull request that changes this file runs it too, against the same two branches.
on:
  schedule:
    # 06:17 UTC, away from the start of the hour, when GitHub delays scheduled runs most.
    - cron: "17 6 * * *"
  pull_request:
    paths: [".github/workflows/audit.yml"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      # Each branch's result stands alone: one main has and dev has fixed means a release is due.
      fail-fast: false
      matrix:
        branch: [dev, main]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
      # No `version`: the pnpm the checked-out branch's `packageManager` names, since main's copy of
      # this file also checks out dev, and the action refuses a `version` that differs from it.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Every dependency, dev ones included, at every severity, as a release's first step reads them.
      # pnpm 12 is a native binary and audits the lockfile alone, so nothing is installed and no Node
      # is set up. The report goes to the run's summary as well as its log.
      - name: Audit the lockfile
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          status=0
          pnpm audit > "$RUNNER_TEMP/audit.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/audit.txt"
          {
            echo "### \`pnpm audit\` of $BRANCH at $(git rev-parse --short HEAD)"
            echo '```text'
            cat "$RUNNER_TEMP/audit.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
