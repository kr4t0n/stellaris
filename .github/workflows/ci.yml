name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# `check` is the job the branch rules require. The other three build what a release ships, the
# images, the npm packages, and the chart, the way publish.yml, npm-publish.yml, and helm-publish.yml
# do, and run them; they push and publish nothing, and run beside `check` rather than after it.
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # CI makes no commits, so the commit hook that `prepare` installs is left out.
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the secret scan reads every commit and not only the tip.
          fetch-depth: 0
      # The scan the commit hook runs on what is staged, here over every commit, so a commit made
      # without the hook is caught too. The archive is checked against its published sha256 before
      # it runs, so a version bump changes both lines together.
      - name: Scan the history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$dir/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  $dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          "$dir/gitleaks" git --redact --verbose --no-banner
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build precedes lint: type-aware rules need the declaration files of workspace packages.
      # `tsc -b` is the type check too, so there is no separate typecheck step.
      - run: pnpm build
      - run: pnpm build:web
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # The browser tests drive the built interface in Chromium against a fake board, and the exit
      # test against a board server of scripted citizens, which needs the server's build above.
      - run: pnpm --filter @stellaris/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  images:
    # amd64 only. The server image's build stage runs on the builder's platform for every target, so
    # its arm64 build differs only in the base image's; the runner image's build stage runs on the
    # target, so an arm64-only failure, such as the Agent SDK's per-platform binary package, first
    # shows in publish.yml's build on the next push to main.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Both at once, into the runner's own Docker, where the smoke test runs them as built. No layer
      # cache: reading publish.yml's takes a BuildKit container whose images must then be exported
      # into Docker, and its layers seldom match a build days later, once the base images have moved.
      - name: Build the server and runner images
        run: |
          set -uo pipefail
          docker build --progress=plain -f apps/server/Dockerfile -t stellaris-server:ci . > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          docker build --progress=plain -f apps/runner/Dockerfile -t stellaris-runner:ci . > "$RUNNER_TEMP/runner.log" 2>&1 &
          runner=$!
          status=0
          wait "$server" || { status=1; echo "::error::The server image did not build."; }
          wait "$runner" || { status=1; echo "::error::The runner image did not build."; }
          for image in server runner; do
            echo "::group::The $image image's build"
            cat "$RUNNER_TEMP/$image.log"
            echo "::endgroup::"
          done
          exit "$status"
      - run: docker image ls stellaris-server:ci && docker image ls stellaris-runner:ci
      - run: scripts/docker/smoke.sh stellaris-server:ci stellaris-runner:ci

  npm:
    runs-on: ubuntu-24.04
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:web
      - run: pnpm pack:npm
      # As npm-publish.yml does before it publishes: installed from the tarballs, the CLI creates a
      # society, the server serves the interface, and the runner enrolls and connects.
      - name: Pack and smoke-test the packages
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          npm pack ./release/stellaris ./release/stellaris-runner --pack-destination "$RUNNER_TEMP/tarballs"
          scripts/npm/smoke.sh "$RUNNER_TEMP/tarballs"

  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - run: scripts/helm/check.sh
