name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # CI makes no commits, so the commit hook that `prepare` installs is left out.
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the secret scan reads every commit and not only the tip.
          fetch-depth: 0
      # The scan the commit hook runs on what is staged, here over every commit, so a commit made
      # without the hook is caught too. The archive is checked against its published sha256 before
      # it runs, so a version bump changes both lines together.
      - name: Scan the history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$dir/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  $dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          "$dir/gitleaks" git --redact --verbose --no-banner
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.6.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build precedes lint: type-aware rules need the declaration files of workspace packages.
      - run: pnpm build
      - run: pnpm build:web
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm test
      # The browser tests drive the built interface in Chromium against a fake board, and the exit
      # test against a board server of scripted citizens, which needs the server's build above.
      - run: pnpm --filter @stellaris/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
