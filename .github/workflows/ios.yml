name: ios

# The iOS client, on the changes that reach it: its code, and the fixtures the server's own tests
# capture into `apps/ios/fixtures`. Not a required check, since GitHub leaves a required workflow
# that its paths skipped pending, which would block every pull request that leaves the client alone.
# The app's job keeps its screenshots as the `screens` artifact for review.
on:
  push:
    branches: [main, dev]
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boardkit:
    if: false
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # The SDK the app builds with, named rather than taken from the image's default.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: xcodebuild -version && swift --version
      - name: Test BoardKit on the iPhone Duo simulator
        working-directory: apps/ios/BoardKit
        run: |
          set -o pipefail
          xcodebuild -list
          xcodebuild test \
            -scheme BoardKit \
            -destination 'platform=iOS Simulator,name=iPhone Duo,OS=27.1' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            -resultBundlePath "$RUNNER_TEMP/BoardKit.xcresult"
      # The simulator's Keychain turns away a package's tests, which run in no app, so the token
      # store's test runs here, on the host.
      - name: Test BoardKit on macOS
        if: ${{ !cancelled() }}
        working-directory: apps/ios/BoardKit
        run: swift test --scratch-path "$RUNNER_TEMP/swiftpm"

  app:
    runs-on: xcode-27
    # What ends a test that hangs, since the stuck-app watcher leaves the step running. Up to 0.4.1
    # the tests ran up to 48 minutes, counting a run the limit cut with two tests left, and the
    # steps after them, the runner's own cleanup included, up to 8 more: 70 is a quarter over both.
    timeout-minutes: 70
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      # XcodeGen from its release, checked against the digest GitHub lists for the asset.
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
      DESTINATION: platform=iOS Simulator,name=iPhone Duo,OS=27.1
      PROBE_UI: -only-testing:StellarisUITests/HomeProbeUITests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate the project
        working-directory: apps/ios
        run: xcodegen generate
      # A copy of the app that XCTest can't end is captured while it still runs, since a step after
      # the tests could come once it has gone, and where the first copies' console goes is kept
      # beside it, as the `stuck-app` artifact. The step fails when a copy launched against the fake
      # board writes its console to a terminal.
      - name: Test the app on the iPhone Duo simulator
        working-directory: apps/ios
        run: |
          set -o pipefail
          output="$RUNNER_TEMP/test-output.txt"
          : >"$output"
          ../../scripts/ios/catch-stuck-app.sh com.example.stellaris "$output" "$RUNNER_TEMP/stuck-app" &
          watcher=$!
          status=0
          xcodebuild test \
            -project Stellaris.xcodeproj \
            -scheme Stellaris \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            -resultBundlePath "$RUNNER_TEMP/Stellaris.xcresult" \
            -only-testing:StellarisTests/AppIconTests \
            -only-testing:StellarisTests/IconProbeTests \
            $PROBE_UI 2>&1 | tee "$output" || status=$?
          touch "$output.done"
          watched=0
          wait "$watcher" || watched=$?
          if [ "$status" -eq 0 ]; then
            status=$watched
          fi
          exit "$status"
      # The host the build names, expanded into the app's associated domains. A simulator build
      # signs to run locally and keeps its entitlements beside the signature, as Xcode wrote them.
      - name: Show the app's entitlements
        if: ${{ !cancelled() }}
        run: |
          find "$RUNNER_TEMP/derived/Build/Intermediates.noindex" -name 'Stellaris.app*.xcent' \
            -print -exec plutil -p {} \;
      - name: Probe the icon
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set +e
          app=$(find "$RUNNER_TEMP/derived/Build/Products" -maxdepth 2 -name Stellaris.app | head -1)
          echo "app: $app"
          ls -la "$app"
          plutil -p "$app/Info.plist" | grep -i -A12 icon
          xcrun assetutil --info "$app/Assets.car" | head -300
          find "$RUNNER_TEMP/derived/Build/Intermediates.noindex" -name 'assetcatalog_generated_info*.plist' \
            -print -exec plutil -p {} \;
          echo "--- asset compiler lines"
          grep -n -i -E 'actool|CompileAssetCatalog|AppIcon|\.icon' "$RUNNER_TEMP/test-output.txt" | head -60
          echo "--- warnings"
          grep -n -i 'warning:' "$RUNNER_TEMP/test-output.txt" | head -60
          echo "--- simctl ui help"
          xcrun simctl ui help 2>&1
          mkdir -p "$RUNNER_TEMP/screens/home"
          xcrun simctl list devices booted
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, each in devices.items() if runtime.endswith("iOS-27-1")
                     for d in each if d["name"] == "iPhone Duo"))')
          echo "iPhone Duo: $device"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl terminate "$device" com.example.stellaris
          xcrun simctl install "$device" "$app"
          sleep 3
          for look in light dark; do
            xcrun simctl ui "$device" appearance "$look"
            sleep 3
            xcrun simctl io "$device" screenshot --display=1 "$RUNNER_TEMP/screens/home/home-$look.png"
          done
          xcrun simctl spawn "$device" defaults read com.apple.springboard 2>&1 | head -80
          exit 0
      - name: Collect the screenshots
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/screens/tests"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/Stellaris.xcresult" --output-path "$RUNNER_TEMP/screens/tests"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: screens
          path: ${{ runner.temp }}/screens
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: stuck-app
          path: ${{ runner.temp }}/stuck-app
          if-no-files-found: ignore
          retention-days: 14
