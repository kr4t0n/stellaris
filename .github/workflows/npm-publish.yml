name: npm-publish

# Stages the npm packages for release: @kubitnodes/stellaris (the admin CLI and the board server
# with its interface) and @kubitnodes/stellaris-runner. It uses npm's trusted publishing (OIDC),
# with no token secret, and each package's trusted publisher authorizes kr4t0n/stellaris and
# npm-publish.yml to stage only, so nothing reaches users until a maintainer approves the staged
# version with 2FA: `npm stage list <package>`, then `npm stage approve <stage id>`.
#
# A push to main packs the packages and smoke-tests them, so a broken package shows long before a
# release; a `v*` tag, or a run by hand, also stages. The version is STELLARIS_VERSION in
# packages/shared/src/version.ts: a tag must match it, and a version already on npm is left alone,
# since npm refuses a republish with an error that reads like a credentials problem. A version
# already staged and waiting cannot be staged again either, so that package fails alone.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # npm exchanges this workflow's OIDC identity for the right to stage, and attaches provenance.
      id-token: write
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      # No registry-url: setup-node would write an .npmrc that asks for a token instead.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Check that npm can stage a publish
        run: |
          npm stage publish --help > /dev/null || { echo "::error::npm $(npm --version) cannot stage a publish; staged publishing needs a newer npm."; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:web
      - run: pnpm pack:npm
      - id: unpublished
        name: Find the packages whose version is not on npm yet
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            echo "A push to $GITHUB_REF_NAME packs and tests; a v* tag stages a release."
            echo "dirs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(node -p 'require("./release/manifest.json")[0].version')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match STELLARIS_VERSION $version."
            exit 1
          fi
          dirs=""
          for row in $(node -p 'require("./release/manifest.json").map((p) => `${p.name}@${p.version}=${p.dir}`).join(" ")'); do
            if npm view "${row%%=*}" version > /dev/null 2>&1; then
              echo "::notice title=Already published::${row%%=*} is on npm and was left alone. Bump STELLARIS_VERSION to release changes."
            else
              dirs="$dirs ${row##*=}"
            fi
          done
          echo "dirs=${dirs# }" >> "$GITHUB_OUTPUT"
      # Proves the tarballs are what a user gets: installed from them, the CLI creates a society,
      # the server serves the interface, and the runner connects.
      - name: Pack and smoke-test the packages
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          npm pack ./release/stellaris ./release/stellaris-runner --pack-destination "$RUNNER_TEMP/tarballs"
          scripts/npm/smoke.sh "$RUNNER_TEMP/tarballs"
      # Each package is staged on its own, so one that fails, such as a version already staged,
      # leaves the other staged; the run fails if either does.
      - name: Stage for approval
        if: steps.unpublished.outputs.dirs != ''
        env:
          DIRS: ${{ steps.unpublished.outputs.dirs }}
        run: |
          failed=""
          for dir in $DIRS; do
            name=$(node -p "require('./release/$dir/package.json').name")
            version=$(node -p "require('./release/$dir/package.json').version")
            if npm stage publish "./release/$dir"; then
              echo "- \`$name@$version\` staged: \`npm stage list $name\`, then \`npm stage approve <stage id>\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Could not stage $name@$version."
              failed="$failed $name"
            fi
          done
          [ -z "$failed" ]
