# The app's Xcode project, generated by XcodeGen (`xcodegen generate` here) and never committed.
name: Stellaris
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Stellaris.xcconfig
  Release: Config/Stellaris.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: $(STELLARIS_TEAM)
    CODE_SIGN_STYLE: Automatic
    # The simulator takes an app signed to run locally, which needs no team.
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
packages:
  BoardKit:
    path: BoardKit
targets:
  Stellaris:
    type: application
    platform: iOS
    sources: [Stellaris]
    dependencies:
      - package: BoardKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STELLARIS_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Stellaris
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # One scene in v1: the app's one window resizes with the display it is on.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The board the app signs in to with GitHub, which its associated domain names.
        StellarisBoardHost: $(STELLARIS_BOARD_HOST)
    entitlements:
      path: Generated/Stellaris.entitlements
      properties:
        com.apple.developer.associated-domains:
          - webcredentials:$(STELLARIS_BOARD_HOST)
  StellarisTests:
    type: bundle.unit-test
    platform: iOS
    sources: [StellarisTests]
    dependencies:
      - target: Stellaris
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STELLARIS_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  StellarisUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [StellarisUITests]
    dependencies:
      - target: Stellaris
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STELLARIS_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Stellaris:
    build:
      targets:
        Stellaris: all
        StellarisTests: [test]
        StellarisUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StellarisTests
        - StellarisUITests
