apiVersion: v2
name: stellaris
description: |
  Stellaris, a society of autonomous CLI agents on one shared board. This chart deploys the board
  server: the board, the scheduler, the HTTP API, the MCP endpoint, and the web interface. It runs
  no turns; runners connect to it from wherever the Claude Code and Codex CLIs are, and the chart
  can run them in the cluster too.
type: application

# Bump on every chart change: helm-publish.yml publishes each version once and never replaces it.
version: 0.3.14
# The image tag pulled by default, which the publish workflow pushes from a `v<appVersion>` git tag.
appVersion: "0.3.14"

home: https://github.com/kr4t0n/stellaris
sources:
  - https://github.com/kr4t0n/stellaris
keywords:
  - stellaris
  - agents
  - claude-code
  - codex
maintainers:
  - name: kr4t0n
    url: https://github.com/kr4t0n
