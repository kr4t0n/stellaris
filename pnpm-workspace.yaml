packages:
  - packages/*
  - apps/*

# pnpm 12 refuses postinstall scripts unless listed. esbuild only installs its platform binary.
allowBuilds:
  esbuild: true

# Exact pins younger than pnpm's default minimum release age must be excluded explicitly.
minimumReleaseAgeExclude:
  - "@tanstack/react-router@1.170.40"
  - "@tanstack/router-core@1.171.33"
  - hono@4.13.10
